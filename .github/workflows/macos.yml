name: macOS

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.15.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Require Apple Silicon runtime
        run: node -e 'if (process.platform !== "darwin" || process.arch !== "arm64") throw new Error("Release verification requires darwin/arm64")'
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run check
      - run: npm run check:native
      - run: npm run check:docs
      - run: npm run check:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-browser-failures-node-${{ matrix.node }}
          path: |
            test-results/ui-e2e
            playwright-report
          if-no-files-found: ignore
      - run: npm test
      - run: npm run local-release -- --output "$RUNNER_TEMP/xfx-release" --smoke

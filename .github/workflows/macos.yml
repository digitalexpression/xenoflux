name: macOS

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.15.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:native
      - run: npm run check:docs
      - run: npm test
      - run: npm run local-release -- --output "$RUNNER_TEMP/xfx-release" --smoke
